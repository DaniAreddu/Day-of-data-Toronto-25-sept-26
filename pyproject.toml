[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reliability-lab"
version = "0.1.0"
description = "Conference demo: why AI answers fail when the data platform gives the model the wrong truth."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Daniele Mario Areddu" }]
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
fabric = [
    "pyodbc>=5.1",
]

[project.scripts]
ai-reliability-lab = "ai_reliability_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["fabric/notebooks/BuildTrustedLayer.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"fabric/notebooks/BuildTrustedLayer.py" = ["F821", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
