name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_BACKEND: duckdb
      NARRATOR: deterministic
      PYTHONUTF8: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit-message attribution scan

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Deterministic dataset verification
        run: python scripts/generate_demo_data.py --check

      - name: Notebook JSON validation
        run: |
          python scripts/build_fabric_notebook.py --check
          python -c "import json; json.load(open('fabric/notebooks/BuildTrustedLayer.ipynb', encoding='utf-8'))"

      - name: Secret-pattern scan
        run: python scripts/scan_repository.py --secrets

      - name: Repository-attribution scan
        run: python scripts/scan_repository.py --attribution --commits

      - name: Demo smoke test (offline, no Fabric, no Ollama)
        run: |
          python scripts/verify_demo.py
          ai-reliability-lab demo
          python scripts/package_fabric_upload.py --no-zip
          streamlit run app/streamlit_app.py --server.headless true --server.port 8599 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8599/_stcore/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8599/_stcore/health
          kill %1
